<header class="page wrap"><span class="eyebrow">TEST • REVIEW • IMPROVE</span><h1>🧠 Coding Quizzes</h1><p>Choose a difficulty and test what you learned.</p></header>
<main class="wrap"><div class="quiz-levels"><button class="selected" onclick="setLevel('beginner',this)">🌱 Beginner</button><button onclick="setLevel('intermediate',this)">🌿 Intermediate</button><button onclick="setLevel('advanced',this)">🚀 Advanced</button></div><form id="quiz"></form><button class="btn primary" onclick="check(event)">Check My Score →</button><div id="result" class="result"></div></main><footer>⚡ CodeSpark — Practice makes progress.</footer>
<script>
const qs={beginner:[["What does a variable store?","A value","A keyboard","A website","a"],["Which Python command prints output?","show()","print()","write()","b"],["Which is a Boolean value?","25","Hello","True","c"],["Which repeats code?","loop","title","comment","a"],["What is debugging?","Finding and fixing problems","Deleting code","Buying a computer","a"],["Which is JavaScript output?","console.log()","print()","displayCode()","a"],["What starts a Python function?","func","def","make","b"],["What does + usually do?","Adds values","Deletes values","Compares only","a"],["Which is text?","42","'Hello'","True","b"],["First coding step?","Understand the problem","Skip testing","Guess","a"]],intermediate:[["What does a function help with?","Reuse code","Turn off PC","Draw only","a"],["Which loop repeats while a condition is true?","while","print","string","a"],["What is a list used for?","Store multiple values","Only comments","Errors","a"],["What is an object commonly used for in JS?","Related properties/data","Printing only","Deleting HTML","a"],["What does ==/=== relate to?","Comparison","Looping","Comments","a"],["What is an algorithm?","Step-by-step solution","A browser","A variable only","a"],["Why use functions?","Organization and reuse","To avoid all variables","To remove output","a"],["What is an exception?","A runtime problem/event","A CSS color","A keyboard","a"],["Nested loop means?","A loop inside another loop","Two files","A comment","a"],["Testing means?","Checking expected behavior","Changing the keyboard","Skipping errors","a"]],advanced:[["What is OOP?","Object-Oriented Programming","Output Only Program","Open Online Page","a"],["DOM stands for?","Document Object Model","Data Output Mode","Digital Object Machine","a"],["An API allows applications to?","Communicate with services","Only style text","Turn off code","a"],["Why handle errors?","To respond safely to problems","To remove all code","To slow programs","a"],["What is a class?","A blueprint for objects","A browser tab","A loop only","a"],["What does an event handler do?","Responds to an event","Deletes a page","Compiles Python","a"],["Why modularize code?","Make code easier to organize/reuse","Make it longer","Remove testing","a"],["A test case contains?","Inputs and expected behavior","Only colors","A password","a"],["What is refactoring?","Improving code structure without changing intended behavior","Deleting a project","Adding random code","a"],["A good project begins with?","Clear requirements","Random coding","No testing","a"]]};
let level="beginner";function render(){quiz.innerHTML=qs[level].map((q,i)=>`<article class="quiz-card"><h3>${i+1}. ${q[0]}</h3>${q.slice(1,4).map((x,j)=>`<label><input type="radio" name="q${i}" value="${String.fromCharCode(97+j)}"> ${x}</label>`).join("")}</article>`).join("")}
function setLevel(x,b){level=x;document.querySelectorAll(".quiz-levels button").forEach(y=>y.classList.remove("selected"));b.classList.add("selected");result.style.display="none";render()}
function check(e){e.preventDefault();let score=0;qs[level].forEach((q,i)=>{if(document.querySelector(`input[name=q${i}]:checked`)?.value===q[4])score++});result.style.display="block";result.innerHTML=`You scored <b>${score}/10</b> — ${score>=8?"Excellent! 🏆":score>=5?"Good work! Keep practicing.":"Review the modules and try again."}`;localStorage.setItem("best_"+level,Math.max(score,+localStorage.getItem("best_"+level)||0))}
render();
</script><script src="app.js"></script></body></html>
