<main class="wrap"><div class="project-grid" id="projects"></div></main><footer>⚡ CodeSpark — Build, test, improve.</footer>
<script>
const p=[["🐍","Calculator","Python","Use variables, input and operators to build a basic calculator.","Beginner"],["🐍","Number Guessing Game","Python","Use conditions and loops to create a guessing game.","Beginner"],["🐍","Student Marks Manager","Python","Store marks and calculate total, average and grade.","Intermediate"],["🟨","Digital Greeting","JavaScript","Use variables, functions and browser interaction.","Beginner"],["🟨","Quiz App","JavaScript","Build questions, options, score and feedback.","Intermediate"],["🟨","To-Do List","JavaScript","Use DOM and events to add and remove tasks.","Advanced"],["💻","Coding Awareness Page","Both","Create a webpage explaining a coding concept to younger students.","Intermediate"],["🚀","Final Capstone","Both","Combine lessons, editor practice and a real-world problem into one project.","Advanced"]];
projects.innerHTML=p.map(x=>`<article class="project-card"><div class="project-icon">${x[0]}</div><span class="tag">${x[2]} • ${x[4]}</span><h2>${x[1]}</h2><p>${x[3]}</p><button onclick="start('${x[1]}')">Start Project →</button></article>`).join("");
function start(x){localStorage.setItem("project",x);alert(x+" added to your project workspace!")}
</script><script src="app.js"></script></body></html>
